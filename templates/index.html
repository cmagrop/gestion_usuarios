<!DOCTYPE html>
<html lang="es">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
</head>
<body>
    <div class="container">
        <a href="/usuarios/nuevo" class="btn btn-primary">
            Nuevo usuario</a>    
        <table class="table table-bordered">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre completo</th>
                    <th>E-mail</th>
                    <th>Fecha de creación</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for usuario in todos_los_usuarios %}
                <tr>
                    <td>{{usuario.id}}</td>
                    <td>{{usuario.nombre}}</td>
                    <td>{{usuario.email}}</td>
                    <td>{{usuario.created_at}}</td>
                    <td>
                        <a class="btn btn-info btn-sm" href="/{{usuario.id}}">Ver</a>
                        <a  class="btn btn-warning btn-sm" href="/{{usuario.id}}/editar">Editar</a>
                        <a  class="btn btn-danger btn-sm"  href="/{{usuario.id}}/eliminar">Eliminar</a>
                    </td>
                    
                </tr>
                {% endfor %}
            </tbody>

        </table>    


    </div>
    
</body>
</html>
